name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Tuck.zip
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 build/Tuck.zip | tee build/Tuck.zip.sha256
          gh release create "$GITHUB_REF_NAME" build/Tuck.zip build/Tuck.zip.sha256 \
            --title "Tuck $GITHUB_REF_NAME" --generate-notes
